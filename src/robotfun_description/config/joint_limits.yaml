# Límites articulares del brazo (5 actuadores joint_1..joint_5, joint_5 = gripper).
# Coherentes con el firmware (servos ±90° = ±1.5708 rad) y con Q_MIN/Q_MAX de
# robotfun_kinematics.core.dh_model. Consumible por MoveIt2.
joint_limits:
  joint_1: {has_position_limits: true, min_position: -1.5708, max_position: 1.5708, has_velocity_limits: true, max_velocity: 1.5}
  joint_2: {has_position_limits: true, min_position: -1.5708, max_position: 1.5708, has_velocity_limits: true, max_velocity: 1.5}
  joint_3: {has_position_limits: true, min_position: -1.5708, max_position: 1.5708, has_velocity_limits: true, max_velocity: 1.5}
  joint_4: {has_position_limits: true, min_position: -1.5708, max_position: 1.5708, has_velocity_limits: true, max_velocity: 1.5}
  joint_5: {has_position_limits: true, min_position: 0.0,     max_position: 1.2,    has_velocity_limits: true, max_velocity: 3.0}
